<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마산무학여자고등학교 급식 정보</title>
  <style>
    /* 폰트 설정 */
    @font-face {
        font-family: 'NexonMaplestory';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFLight.woff') format('woff');
        font-weight: 300;
        font-display: swap;
    }

    @font-face {
        font-family: 'NexonMaplestory';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        font-weight: 700;
        font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'NexonMaplestory', sans-serif;
      font-weight: 300;
    }

    /* 귀여운 파스텔톤 배경 및 아기자기한 오라 */
    body {
      background: linear-gradient(135deg, #fff0f5 0%, #eef2ff 50%, #fff5e6 100%);
      color: #4a4a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 182, 193, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 28px 24px 20px 24px;
      border: 3px solid #ffe3e8;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ff5e7e;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 0.9rem;
      color: #a0a0a0;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="date"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ffd1dc;
      border-radius: 16px;
      font-size: 0.9rem;
      outline: none;
      color: #555;
      background-color: #fffafb;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus {
      border-color: #ff758c;
    }

    button {
      padding: 10px 18px;
      background: linear-gradient(135deg, #ff758c 0%, #ff8fa3 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 117, 140, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .meal-card {
      background: #fff9fa;
      border: 2px dashed #ffccd5;
      border-radius: 20px;
      padding: 20px;
      min-height: 180px;
    }

    .meal-type {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ff5e7e;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #ffd1dc;
    }

    .meal-list {
      list-style: none;
    }

    .meal-list li {
      padding: 5px 0;
      font-size: 0.92rem;
      color: #555;
      border-bottom: 1px dashed #ffe3e8;
    }

    .meal-list li:last-child {
      border-bottom: none;
    }

    .cal-info {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #999;
      text-align: right;
      font-weight: 700;
    }

    .status-msg {
      text-align: center;
      color: #aaa;
      padding: 40px 0;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* 푸터 스타일 */
    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px dashed #ffe3e8;
      text-align: center;
      font-size: 0.72rem;
      color: #b0b0b0;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎀 마산무학여자고등학교</h1>
    <p>오늘의 맛있는 급식 메뉴 🍱</p>
  </div>

  <div class="search-box">
    <input type="date" id="mealDate">
    <button onclick="getMealInfo()">조회</button>
  </div>

  <div class="meal-card" id="resultArea">
    <div class="status-msg">날짜를 선택하고 조회 버튼을 눌러주세요! ✨</div>
  </div>

  <div class="footer">
    Developed for educational purposes by Joo-yeon, Park
  </div>
</div>

<script>
  // 페이지 첫 로드 시 오늘 날짜로 자동 세팅 및 조회
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('mealDate').value = today;
    getMealInfo();
  });

  async function getMealInfo() {
    const dateValue = document.getElementById('mealDate').value;
    const resultArea = document.getElementById('resultArea');

    if (!dateValue) {
      alert('날짜를 선택해주세요!');
      return;
    }

    // YYYY-MM-DD 포맷을 YYYYMMDD로 변환
    const formattedDate = dateValue.replace(/-/g, '');
    const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=S10&SD_SCHUL_CODE=9010237&MLSV_YMD=${formattedDate}`;

    resultArea.innerHTML = '<div class="status-msg">급식 정보를 맛있게 불러오는 중... 🍳</div>';

    try {
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('데이터 요청 실패');

      const xmlText = await response.text();

      // DOMParser를 이용한 XML 파싱
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      // API 결과 코드 확인
      const resultCode = xmlDoc.querySelector('RESULT > CODE');
      if (resultCode && resultCode.textContent !== 'INFO-000') {
        const message = xmlDoc.querySelector('RESULT > MESSAGE')?.textContent || '급식 정보가 없습니다.';
        resultArea.innerHTML = `<div class="status-msg">😴 ${message}</div>`;
        return;
      }

      const rows = xmlDoc.querySelectorAll('row');
      if (rows.length === 0) {
        resultArea.innerHTML = '<div class="status-msg">😴 해당 날짜의 급식 정보가 없습니다.</div>';
        return;
      }

      let html = '';
      rows.forEach(row => {
        const mealType = row.querySelector('MMEAL_SC_NM')?.textContent || '급식';
        const rawDish = row.querySelector('DDISH_NM')?.textContent || '';
        const calInfo = row.querySelector('CAL_INFO')?.textContent || '';

        // 메뉴 내 포함된 <br/> 태그 기준 배열 분리
        const dishes = rawDish.split(/<br\s*\/?>/i);

        html += `<div class="meal-type">🍴 ${mealType}</div>`;
        html += `<ul class="meal-list">`;
        dishes.forEach(dish => {
          if (dish.trim()) {
            html += `<li>• ${dish.trim()}</li>`;
          }
        });
        html += `</ul>`;

        if (calInfo) {
          html += `<div class="cal-info">⚡ 열량: ${calInfo}</div>`;
        }
      });

      resultArea.innerHTML = html;

    } catch (error) {
      console.error(error);
      resultArea.innerHTML = '<div class="status-msg">😥 급식 정보를 불러오지 못했습니다.</div>';
    }
  }
</script>

</body>
</html>
