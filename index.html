<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마산무학여자고등학교 급식 정보</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 0.875rem;
      color: #64748b;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="date"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="date"]:focus {
      border-color: #2563eb;
    }
    button {
      padding: 10px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .meal-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      min-height: 180px;
    }
    .meal-type {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #cbd5e1;
    }
    .meal-list {
      list-style: none;
    }
    .meal-list li {
      padding: 5px 0;
      font-size: 0.925rem;
      color: #475569;
      border-bottom: 1px dashed #e2e8f0;
    }
    .meal-list li:last-child {
      border-bottom: none;
    }
    .cal-info {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #64748b;
      text-align: right;
    }
    .status-msg {
      text-align: center;
      color: #64748b;
      padding: 40px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏫 마산무학여자고등학교</h1>
    <p>오늘의 급식 메뉴</p>
  </div>

  <div class="search-box">
    <input type="date" id="mealDate">
    <button onclick="getMealInfo()">조회</button>
  </div>

  <div class="meal-card" id="resultArea">
    <div class="status-msg">날짜를 선택한 후 조회 버튼을 눌러주세요.</div>
  </div>
</div>

<script>
  // 페이지 첫 로드 시 오늘 날짜로 자동 세팅 및 조회
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('mealDate').value = today;
    getMealInfo();
  });

  async function getMealInfo() {
    const dateValue = document.getElementById('mealDate').value;
    const resultArea = document.getElementById('resultArea');

    if (!dateValue) {
      alert('날짜를 선택해주세요.');
      return;
    }

    // YYYY-MM-DD 포맷을 YYYYMMDD로 변환
    const formattedDate = dateValue.replace(/-/g, '');
    const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=S10&SD_SCHUL_CODE=9010237&MLSV_YMD=${formattedDate}`;

    resultArea.innerHTML = '<div class="status-msg">급식 정보를 불러오는 중...</div>';

    try {
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('데이터 요청 실패');

      const xmlText = await response.text();

      // DOMParser를 이용한 XML 파싱
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      // API 에러 코드 확인
      const resultCode = xmlDoc.querySelector('RESULT > CODE');
      if (resultCode && resultCode.textContent !== 'INFO-000') {
        const message = xmlDoc.querySelector('RESULT > MESSAGE')?.textContent || '급식 정보가 없습니다.';
        resultArea.innerHTML = `<div class="status-msg">${message}</div>`;
        return;
      }

      const rows = xmlDoc.querySelectorAll('row');
      if (rows.length === 0) {
        resultArea.innerHTML = '<div class="status-msg">해당 날짜의 급식 정보가 없습니다.</div>';
        return;
      }

      let html = '';
      rows.forEach(row => {
        const mealType = row.querySelector('MMEAL_SC_NM')?.textContent || '급식';
        const rawDish = row.querySelector('DDISH_NM')?.textContent || '';
        const calInfo = row.querySelector('CAL_INFO')?.textContent || '';

        // 메뉴 내 포함된 <br/> 태그 기준 배열 분리
        const dishes = rawDish.split(/<br\s*\/?>/i);

        html += `<div class="meal-type">${mealType}</div>`;
        html += `<ul class="meal-list">`;
        dishes.forEach(dish => {
          if (dish.trim()) {
            html += `<li>${dish.trim()}</li>`;
          }
        });
        html += `</ul>`;

        if (calInfo) {
          html += `<div class="cal-info">열량: ${calInfo}</div>`;
        }
      });

      resultArea.innerHTML = html;

    } catch (error) {
      console.error(error);
      resultArea.innerHTML = '<div class="status-msg">급식 정보를 불러오지 못했습니다.</div>';
    }
  }
</script>

</body>
</html>
